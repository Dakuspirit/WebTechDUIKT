<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critical Role - YouTube</title>
    <link rel="stylesheet" href="Pr3.css">
</head>
<body>
<header class="header">
    <div class="logo">YouTube</div>
    <div class="search-bar">Пошук...</div>
    <div class="user-profile">Профіль</div>
</header>

<main>
    <div class="channel-banner"></div>

    <section class="channel-info">
        <div class="avatar">CR</div>
        <div class="details">
            <h1>Critical Role</h1>
            <p>@criticalrole • 2.25M subscribers</p>
            <button class="subscribe-btn">Subscribe</button>
        </div>
    </section>

    <nav class="tabs">
        <span>Home</span>
        <span class="active">Videos</span>
        <span>Shorts</span>
        <span>Live</span>
        <span>Podcasts</span>
    </nav>

    <section class="video-grid">
        <article class="video-card">
            <div class="thumbnail"></div>
            <h3>Campaign 3: Episode 100</h3>
            <p>400K views • 2 days ago</p>
        </article>
        <article class="video-card">
            <div class="thumbnail"></div>
            <h3>Bells Hells | C3E99</h3>
            <p>500K views • 1 week ago</p>
        </article>
        <article class="video-card">
            <div class="thumbnail"></div>
            <h3>Candela Obscura</h3>
            <p>300K views • 2 weeks ago</p>
        </article>
    </section>
</main>
</body>
</html>
